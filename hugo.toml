baseURL = "https://thelostcircuit.github.io/blog/"
languageCode = "en-us"
title = "thelostcircuit"
theme = "terminal"
pagination.pagerSize = 10

[markup.goldmark.renderer]
  unsafe = true

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  fullWidthTheme = false
  centerTheme = true

[languages]
  [languages.en]
    title = "thelostcircuit"
    copyright = "thelostcircuit"
    [languages.en.params]
      subtitle = "IT, homelab, and other notes"
      keywords = "IT, homelab, security, personal"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      [languages.en.params.logo]
        logoText = "thelostcircuit"
        logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts"
